name: Release

# SPEC-024: ready-to-run builds. A `v*` tag publishes a GitHub Release;
# manual runs and PRs touching packaging only upload workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: ALSA headers + runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libasound2-dev: ALSA headers for the realtime (cpal) build.
          # The AppImage does NOT bundle ALSA; the host's ALSA + PipeWire
          # plugin is used, so no plugin/pipewire packages are needed here.
          sudo apt-get install -y libasound2-dev libfuse2
      - name: Build
        run: cargo build --release --locked -p daw-gui --features audio
      - name: AppImage
        if: runner.os == 'Linux'
        run: packaging/linux/build-appimage.sh target/release/sound-pro "$VERSION" dist
      - name: Verify AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Unpack the AppImage (no FUSE needed) and confirm the binary is
          # present and does not bundle ALSA (audio uses the host's
          # ALSA/PipeWire). The binary links against libasound at build time
          # and must resolve it from the host at run time.
          img=$(ls dist/Sound-Pro-*.AppImage)
          "$img" --appimage-extract >/dev/null 2>&1 || true
          echo "== AppImage contents (usr/lib should NOT contain ALSA) =="
          find squashfs-root -maxdepth 3 -type f | sort
          if find squashfs-root/usr -name 'libasound*' | grep -q .; then
            echo "::error::AppImage unexpectedly bundles ALSA; audio must use the host ALSA/PipeWire"
            exit 1
          fi
          echo "(no bundled ALSA: audio uses the host ALSA/PipeWire)"
      - name: Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "Sound-Pro-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "stage/$dir" | Out-Null
          Copy-Item target/release/sound-pro.exe "stage/$dir/"
          Copy-Item README.md "stage/$dir/"
          Get-ChildItem -Path . -Filter 'LICENSE*' | Copy-Item -Destination "stage/$dir/"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "stage/$dir" -DestinationPath "dist/$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sound-pro-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Sound Pro $VERSION" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
