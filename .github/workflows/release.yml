name: Release

# SPEC-024: ready-to-run builds. A `v*` tag publishes a GitHub Release;
# manual runs and PRs touching packaging only upload workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: ALSA headers + runtime + plugins
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libasound2-dev: ALSA headers for the realtime (cpal) build.
          # libasound2-plugins: pipewire/pulse plugins that AppImage bundles so
          # sound works over PipeWire/PulseAudio without host packages.
          # libpipewire-0.3-0: plugin runtime the AppImage bundles.
          sudo apt-get install -y libasound2-dev libasound2-plugins libpipewire-0.3-0 libfuse2
      - name: Build
        run: cargo build --release --locked -p daw-gui --features audio
      - name: AppImage
        if: runner.os == 'Linux'
        run: packaging/linux/build-appimage.sh target/release/sound-pro "$VERSION" dist
      - name: Verify AppImage is self-contained
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Unpack the AppImage (no FUSE needed) and confirm the audio runtime
          # is bundled and resolves. The script already fails the build if a
          # non-glibc library is unresolved; this step surfaces the evidence
          # in the CI log.
          img=$(ls dist/Sound-Pro-*.AppImage)
          "$img" --appimage-extract >/dev/null 2>&1 || true
          echo "== bundled libasound + ALSA plugins =="
          find squashfs-root/usr/lib \( -name 'libasound*' -o -name 'libasound_module*' \) | sort
          echo "== ldd of the binary against the bundled lib dir =="
          LD_LIBRARY_PATH=squashfs-root/usr/lib ldd squashfs-root/usr/bin/sound-pro || true
          echo "== unresolved non-glibc libraries (must be empty) =="
          missing=$(LD_LIBRARY_PATH=squashfs-root/usr/lib ldd squashfs-root/usr/bin/sound-pro \
            | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "::error::AppImage has unresolved libraries: $missing"
            exit 1
          fi
          echo "(none)"
      - name: Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "Sound-Pro-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "stage/$dir" | Out-Null
          Copy-Item target/release/sound-pro.exe "stage/$dir/"
          Copy-Item README.md "stage/$dir/"
          Get-ChildItem -Path . -Filter 'LICENSE*' | Copy-Item -Destination "stage/$dir/"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "stage/$dir" -DestinationPath "dist/$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sound-pro-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Sound Pro $VERSION" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
